name: Gold HAR Baseline (Daily)

# refit ทุกวันหลังตลาดปิด 22:47 UTC จ.–ศ. (05:47 น. ไทย) -- 10 นาทีหลัง VRP Monitor
# ใช้แท่งชุดเดียวกัน log สองตัวจึงเทียบวันต่อวันได้ตรงๆ (คอลัมน์ last_bar_date)
# OLS บนข้อมูล ~500 วันใช้เวลาไม่ถึงวินาที refit รายวันจึงไม่มีต้นทุน
#
# นี่คือ diagnostic log เท่านั้น ไม่ใช่ trading signal -- ตาม principle
# scope discipline: ยังไม่ผูกเข้ากับ GOD.pine หรือ signal อื่นใด แค่สะสม
# ข้อมูลไว้เทียบกับ gold_vrp_monitor.py ตามแผนเดิม
on:
  schedule:
    - cron: "47 22 * * 1-5"
  workflow_dispatch:
    inputs:
      years:
        description: "จำนวนปีย้อนหลังที่ใช้ fit (default 2)"
        required: false
        default: "2"

concurrency:
  group: gold-vrp-commit   # สอง workflow push เข้า main เดียวกัน ห้ามรันซ้อน
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Gold HAR Baseline
        env:
          YEARS: ${{ github.event.inputs.years }}
        run: |
          Y="${YEARS:-2}"
          python gold_har_baseline.py --years "$Y" \
            --log-path gold_har_log.csv \
            --coeffs-path gold_har_coeffs.txt

      - name: Commit log + coefficients back to repo
        run: |
          git config user.name "gold-har-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gold_har_log.csv gold_har_coeffs.txt
          git diff --quiet --cached && exit 0
          git commit -m "gold_har_baseline: refit $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
