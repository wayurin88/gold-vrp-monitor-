name: Gold VRP Monitor

# รันวันละครั้งหลังตลาดปิด: 22:37 UTC จ.–ศ. = 05:37 น. ไทยของวันถัดไป
#   ฤดูร้อน (EDT) = 18:37 ET, ฤดูหนาว (EST) = 17:37 ET -- เลย 17:00 ET แท่งของวันนั้นจบแล้วทั้งสองฤดู
# นาที 37 แทน 00 เพราะ GitHub มักดีเลย์/ข้ามงานที่ตั้งตรงต้นชั่วโมง (เดิม 01:00 UTC รันจริง 06:00–07:00)
# สคริปต์ใช้เฉพาะแท่งที่จบแล้ว (gold_bars.py) และไม่ log ซ้ำถ้ายังไม่มีแท่งใหม่ ดีเลย์ก็ไม่ทำให้ค่าเพี้ยน
on:
  schedule:
    - cron: "37 22 * * 1-5"
  workflow_dispatch:
    inputs:
      front_iv:
        description: "ATM IV ของ weekly ใกล้สุดจาก QuikStrike (คัดลอกจากคอลัมน์ ATM) -- เว้นว่างได้ถ้าไม่มี"
        required: false
        default: ""

concurrency:
  group: gold-vrp-commit   # สอง workflow push เข้า main เดียวกัน ห้ามรันซ้อน
  cancel-in-progress: false

permissions:
  contents: write  # ต้องมีสิทธิ์เขียนกลับเข้า repo เพื่อ commit ไฟล์ log

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Gold VRP Monitor
        env:
          FRONT_IV: ${{ github.event.inputs.front_iv }}
        run: |
          if [ -n "$FRONT_IV" ]; then
            # ใส่ front IV เอง = ตั้งใจเพิ่มแถว แม้แท่งนี้จะ log ไปแล้ว
            python gold_vrp_monitor.py --front-iv "$FRONT_IV" --log-path gold_vrp_log.csv --force
          else
            python gold_vrp_monitor.py --log-path gold_vrp_log.csv
          fi

      - name: Commit log back to repo
        run: |
          git config user.name "gold-vrp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gold_vrp_log.csv
          # ไม่มีแท่งใหม่ / ดึงข้อมูลไม่ได้ -> ข้าม commit เงียบๆ ไม่ error
          git diff --quiet --cached && exit 0
          git commit -m "gold_vrp_monitor: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
